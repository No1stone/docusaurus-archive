<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" role="img" aria-labelledby="diagram-title">
<title id="diagram-title">잠금 테스트에서 두 요청의 순서를 제어하는 흐름</title>
<rect width="480" height="270" rx="12" fill="#edf4fa"/>
<rect x="16" y="14" width="448" height="48" rx="8" fill="#fff" stroke="#93adbf"/>
<text x="240" y="44" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#142d40">A가 트랜잭션을 시작하고 쓰기 락을 획득</text>
<path d="M240 62 v14 m-4 -5 l4 5 l4 -5" fill="none" stroke="#38617f" stroke-width="2"/>
<rect x="16" y="78" width="448" height="48" rx="8" fill="#fff" stroke="#93adbf"/>
<text x="240" y="108" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#142d40">B가 별도 트랜잭션에서 같은 행을 요청</text>
<path d="M240 126 v14 m-4 -5 l4 5 l4 -5" fill="none" stroke="#38617f" stroke-width="2"/>
<rect x="16" y="142" width="448" height="48" rx="8" fill="#fff" stroke="#93adbf"/>
<text x="240" y="172" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#142d40">A가 락을 쥔 동안 B의 완료 여부 확인</text>
<path d="M240 190 v14 m-4 -5 l4 5 l4 -5" fill="none" stroke="#38617f" stroke-width="2"/>
<rect x="16" y="206" width="448" height="48" rx="8" fill="#fff" stroke="#93adbf"/>
<text x="240" y="236" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#142d40">A 커밋 뒤 B의 처리 결과를 확인</text>
</svg>
